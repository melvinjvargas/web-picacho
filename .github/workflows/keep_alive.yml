name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 04:00 UTC (10:00 PM hora local)
    # Los Lunes, Miércoles y Viernes
    - cron: "0 4 * * 1,3,5"
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta la tabla products en Supabase
        run: |
          curl -i -X GET "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
